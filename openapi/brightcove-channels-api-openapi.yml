  schemas:
    UpdateChannel:
      allOf:
      - $ref: '#/components/schemas/ChannelProperties'
      - title: UpdateChannel
        type: object
      - type: object
    ChannelProperties:
      title: CreateChannel
      type: object
      properties:
        name:
          type: string
          description: Name of the channel
        description:
          type: string
          description: Description of the channel
        ssai_enabled:
          type: boolean
          description: Channel enabled for SSAI
          default: false
        mid_roll_import_enabled:
          type: boolean
          description: For SSAI enabled channels, specify if midroll import is enabled or disabled
          default: true
        mid_roll_slot_time:
          maximum: 600
          minimum: 30
          type: integer
          description: For SSAI enabled channels, specify midroll slot duration in seconds
          format: int32
          default: 30
        start_time:
          type: string
          description: Scheduled start time of the channel. Should be a future date/time
          format: date-time
        stop_time:
          type: string
          description: Scheduled stop time of the channel. Should be a future date/time. Leave this empty to run the channel 24*7
          format: date-time
        image_id:
          type: string
          description: Image URL that need to be associated with the channel
          default: https://bc-cloudplayout-prod.s3.amazonaws.com/default_channel_image.png
        live_profile:
          type: string
          description: Live profile on the account that need to be associated with this channel. Use the [List Profiles](https://apis.support.brightcove.com/cloud-playout-apis/references/reference-channels.html#operation/ListProfiles) API to get the profile id's.
        channel_class:
          type: string
          default: single-pipeline
        region:
          type: string
          description: Region for the channel.
          enum:
          - us-east-1
          - us-east-2
          - us-west-2
          - ap-south-1
          - ap-southeast-1
          - ap-southeast-2
          - ap-northeast-1
          - ap-northeast-2
          - eu-central-1
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - eu-north-1
          - sa-east-1
        input_group:
          required:
          - input_type
          type: array
          items:
            properties:
              input_type:
                type: string
                description: The input types for the channel. Playlist is mandatory, rest others are optional
                enum:
                - playlist
                - slate
                - rtmp
                - rtp
              input_id:
                type: string
                description: Applicable only in slate input_type. Denotes a http URL for the slate MP4
                default: https://bc-cloudplayout-prod.s3.amazonaws.com/cloudplayout-slate-v2.mp4
              loop_on_completion:
                type: boolean
                description: Applicable only in playlist input_type. Denotes a looped/non-looped channel
        output_group:
          type: array
          items:
            properties:
              type:
                type: string
                description: Output destination(s) for the channel. rtp is the only option for SSAI enabled channels
                enum:
                - rtmp
                - s3
                - rtp
              ingest_locations:
                type: array
                items:
                  properties:
                    pipeline_id:
                      type: integer
                      description: Indicates the output pipeline. 1 only for now
                      format: int32
                    location:
                      type: string
                      description: Location where the output destination is configured. For rtmp/rtp type; 1. Specify as bc_live if you want Cloud PlayOut to create a new Brightcove Live event. 2. For using an existing BC Live event, pass in the existing event's job ID. See [ListBCLiveChannels](https://apis.support.brightcove.com/cloud-playout-apis/references/reference-channels.html#operation/ListBCLiveChannels) to get the available job id's. For s3 type; pass in the credentials id (Refer [Credentials](https://apis.support.brightcove.com/cloud-playout-apis/references/reference-channels.html#tag/Credentials)) for Cloud Playout to create HLS playlist on the given S3 location.
                    redundancy:
                      type: boolean
                      description: Enables or disables Brightcove Live redundancy. Applicable only for rtmp/rtp type with location as either 'bc_live' or an existing Brightcove live redundant group id available in the users videocloud account.
    GetChannel:
      title: GetChannel
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/ExtendedChannel'
      example:
        public_id: 8635d6147ab64e4788a44d70c23cced0
        name: testChannel
        description: Channel created for testing Cloud Playout
        account_id: '6062814566001'
        state: DRAFT
        start_time: 2020-12-17 06:00:00 UTC
        stop_time: 2020-12-17 07:00:00 UTC
        input_groups: playlist
        output_groups: rtmp
        loop_playlist: true
        playlist_id: '1686204667297382886'
        channel_class: single-pipeline
        ssai_enabled: false
        aws_region: us-east-1
        created_at: 2020-12-16 03:41:22 UTC
        updated_at: 2020-12-17 04:53:30 UTC
        image_url: https://bc-cloudplayout-prod.s3.amazonaws.com/default_channel_image.png
        output_destinations:
        - Brightcove Live
