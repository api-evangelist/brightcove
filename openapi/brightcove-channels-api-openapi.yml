        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Update a cloudplayout channel schedule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelSchedule'
            examples:
              Update Hard Start:
                $ref: '#/components/examples/upsertChannelHardStartSchedule'
              Delete Hard Start:
