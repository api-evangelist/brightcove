      description: Delete a Cloud Playout channel for an account
      operationId: DeleteChannel
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: channel_id
        in: path
        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        202:
          description: 202 Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncMessage'
              example:
                message: Delete initiated
        400:
          description: Bad Request
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
    patch:
      tags:
      - Channels
      summary: Update a channel
      description: Update a Cloud Playout channel for an account
      operationId: UpdateChannel
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Content-Type: application/json'
        required: true
        style: simple
        explode: false
        schema:
          type: string
          default: application/json
      - name: channel_id
        in: path
        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Updates a cloudplayout channel for an account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannel'
            examples:
              Update Name:
                $ref: '#/components/examples/updateName'
              Update Description:
                $ref: '#/components/examples/updateDescription'
              Update Start Time:
                $ref: '#/components/examples/updateStartTime'
              Update Stop Time:
                $ref: '#/components/examples/updateStopTime'
              Enable SSAI:
                $ref: '#/components/examples/enableSSAI'
              Disable SSAI:
                $ref: '#/components/examples/disableSSAI'
              Disable Live Input:
                $ref: '#/components/examples/disableLiveInput'
              Update Input Groups:
                $ref: '#/components/examples/updateInputGroup'
              Update SSAI with Input Groups:
                $ref: '#/components/examples/enableSSAIWithLiveInputGroup'
              Update Loop On Completion:
                $ref: '#/components/examples/updateLoopOnCompletion'
              Update Live Profile:
                $ref: '#/components/examples/updateLiveProfile'
              Update Output Groups:
                $ref: '#/components/examples/updateOutputGroups'
              Update Mid-roll slot time:
                $ref: '#/components/examples/updateMidRollSlotTime'
              Disable Mid-roll import:
                $ref: '#/components/examples/DisableMidRollImportWhenSSAIEnabled'
              Update Multiple Items:
                $ref: '#/components/examples/updateMultiple'
        required: true
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTopLevel'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
              examples:
                Invalid Name and Description:
                  $ref: '#/components/examples/invalidNameAndDescription'
                Enable SSAI with no ad slate:
                  $ref: '#/components/examples/noSlate'
                Bad Image Url:
                  $ref: '#/components/examples/invalidImage'
                Bad Dates:
                  $ref: '#/components/examples/invalidDates'
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
