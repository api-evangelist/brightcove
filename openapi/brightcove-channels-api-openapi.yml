openapi: 3.2.0
info:
  title: Brightcove Cloud Playout Channel Manager API Reference…
  description: Reference for the Brightcove Cloud Playout Channel Manager API, used to access and manage your Cloud Playout channels.
  version: 1.0.0
servers:
- url: https://cm.cloudplayout.brightcove.com
  description: Production server
- url: https://cm.cloudplayout.qa.brightcove.com
  description: QA server
tags:
- name: Channels
paths:
  /accounts/{account_id}/cp_channels:
    x-bc-throttle-key: null
    get:
      tags:
      - Channels
      summary: Get all channels for an account
      description: Gets all Cloud Playout channels for an account
      operationId: GetAllChannels
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllChannels'
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/read
        - BC_CLOUD_PLAYOUT_READ
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
    post:
      tags:
      - Channels
      summary: Create channel
      description: Creates a cloud playout channel for an account
      operationId: CreateChannel
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Content-Type: application/json'
        required: true
        style: simple
        explode: false
        schema:
          type: string
          default: application/json
      requestBody:
        description: Creates a cloudplayout channel for an account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannel'
            examples:
              For non-SSAI channel with Live input enabled & BC Live destination:
                $ref: '#/components/examples/nonSSAIWithLive'
              For non-SSAI channel without Live input enabled & BC Live destination:
                $ref: '#/components/examples/nonSSAIWithoutLive'
              For non-SSAI channel without Live input enabled & 3rd party Live destination:
                $ref: '#/components/examples/nonSSAIWith3rdParty'
              For non-SSAI channel without Live input enabled & S3 destination:
                $ref: '#/components/examples/nonSSAIWithS3'
              For SSAI channel:
                $ref: '#/components/examples/SSAI'
              For SSAI channel with s3 destination:
                $ref: '#/components/examples/SSAIWithS3'
              For SSAI with Live RTP Live input enabled & BC Live destination:
                $ref: '#/components/examples/SSAIWithLive'
              Channel with an existing live job id as output location:
                $ref: '#/components/examples/existingLiveJobIdForOutputLocation'
        required: true
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTopLevel'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
              examples:
                Invalid Name and Description:
                  $ref: '#/components/examples/invalidNameAndDescription'
                Enable SSAI with no ad slate:
                  $ref: '#/components/examples/noSlate'
                Bad Image Url:
                  $ref: '#/components/examples/invalidImage'
                Bad Dates:
                  $ref: '#/components/examples/invalidDates'
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
  /accounts/{account_id}/cp_channels/{channel_id}:
