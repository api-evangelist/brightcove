        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
components:
  schemas:
    CreateWurlApiKey:
      allOf:
      - $ref: '#/components/schemas/WurlApiKey'
      - required:
        - api_key
        - name
        type: object
    GetAllWurlApiKeys:
      title: GetAllWurlApiKeys
      type: object
      properties:
        items:
          type: array
          description: The list of wurl api keys.  List may be empty if no api keys
          items:
            $ref: '#/components/schemas/WurlApiKeys'
      example:
        items:
        - public_id: b8090a8b27664cd5a924b61dc997fe11
          account_id: '70701684277865'
          name: wurl_key_default
          api_key: API_KEY_1
          default: true
          created_at: 2022-04-20 06:44:16 UTC
          updated_at: 2022-04-20 06:44:16 UTC
        - public_id: b67j4a8b27664cd5a924b61dc997fe11
          account_id: '70701684277865'
          name: wurl_key_name
          api_key: API_KEY_2
          default: false
          created_at: 2022-04-20 06:44:16 UTC
          updated_at: 2022-04-20 06:44:16 UTC
    WurlApiKeys:
      title: WurlApiKeysObject
      type: object
      properties:
        public_id:
          type: string
          description: Id for the api key.
        account_id:
          type: string
          description: Video cloud Account id.
        name:
          type: string
          description: Name of the api key.
        api_key:
          type: string
          description: Wurl api key.
        default:
          type: boolean
          description: To denote if the api key is default or not.
        created_at:
          type: string
          description: Time of api key record creation
        updated_at:
          type: string
          description: Time of api key record update
      example:
        public_id: b8090a8b27664cd5a924b61dc997fe11
        account_id: '70701684277865'
        name: wurl_key_default
        api_key: API_KEY
        default: true
        created_at: 2022-04-20 06:44:16 UTC
        updated_at: 2022-04-20 06:44:16 UTC
    AsyncMessage:
      title: MessageObject
      type: object
      properties:
        message:
          type: string
          description: message from the api
    WurlApiKey:
      title: WurlApiKey
      type: object
      properties:
        name:
          type: string
          description: Name of the api key
        api_key:
          type: string
          description: Wurl api key
        default:
          type: string
          description: To denote if the api key is default or not
      example:
        name: wurl_key_name
        api_key: wurl_api_key
        default: false
    UpdateWurlApiKey:
      allOf:
      - $ref: '#/components/schemas/WurlApiKey'
      - title: UpdateWurlApiKey
        type: object
      - type: object
    BadRequest:
      title: BadRequest
      type: object
      properties:
        message:
          type: object
  securitySchemes:
    BC_OAuth2:
      type: oauth2
      description: Brightcove OAuth API. See the [support documentation](https://support.brightcove.com/oauth-api) or [Getting Access Tokens](https://support.brightcove.com/oauth-api-sample-get-access-token) to learn more
      flows:
        clientCredentials:
          tokenUrl: https://oauth.qa.brightcove.com/v4/access_token
          scopes:
            video-cloud/cloud-playout/all: Able to manage cloud playout channels.
            video-cloud/cloud-playout/read: Able to read cloud playout channels.
            BC_CLOUD_PLAYOUT_READ: Permission-based access control
            BC_CLOUD_PLAYOUT_WRITE: Permission-based access control
x-bc-implicit-head: true
x-bc-implicit-options: true
