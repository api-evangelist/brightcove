  parameters:
    jvod_state:
      name: jvod_state
      in: query
      description: Filter results by one or more VOD job states
      style: form
      explode: true
      schema:
        oneOf:
        - type: string
          description: VOD Job state
          enum:
          - error
          - waiting
          - waiting_finish_live
          - processing
          - cancelling
          - cancelled
          - finished
          - failed
          - creating_asset
        - type: array
          items:
            type: string
            description: VOD Job state
            enum:
            - error
            - waiting
            - waiting_finish_live
            - processing
            - cancelling
            - cancelled
            - finished
            - failed
            - creating_asset
    start_token:
      name: start_token
      in: query
      description: Next token from previous page; do not specify when fetching first page
      style: form
      explode: true
      schema:
        type: string
    ContentType:
      name: Content-Type
      in: header
      description: 'Content-Type: application/json'
      required: true
      style: simple
      explode: false
      schema:
        type: string
        default: application/json
      example: application/json
    sort_dir:
      name: sort_dir
      in: query
      description: Sort direction (default is asc):`asc` - ascending; `desc` - descending
      style: form
      explode: true
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    jvod_type:
      name: jvod_type
      in: query
      description: Filter results by one or more VOD job types
      style: form
      explode: true
      schema:
        oneOf:
        - type: string
          description: VOD Job type
          enum:
          - s3
          - ftp
          - instant
          - error
        - type: array
          items:
            type: string
            description: VOD Job type
            enum:
            - s3
            - ftp
            - instant
            - error
    created_at:
      name: created_at
      in: query
      description: Filter results by Unix time of job creation (in milliseconds)
      style: form
      explode: true
      schema:
        type: integer
    XAPIKEY:
      name: X-API-KEY
      in: header
      description: 'X-API-KEY: {Your_Live_API_Key}'
      required: true
      style: simple
      explode: false
      schema:
        type: string
    page_size:
      name: page_size
      in: query
      description: Max number of items to return in one request (1-1000, default is 10)
      style: form
      explode: true
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    account_id:
      name: account_id
      in: query
      description: Filter results by particular account, or specify ‘*’ to search all accounts.  Default value is account API key belongs to
      style: form
      explode: true
      schema:
        type: string
    label:
      name: label
      in: query
      description: Filter results by one or more VOD job labels
      style: form
      explode: true
      schema:
        oneOf:
        - type: string
          description: VOD job label
          enum:
          - none
          - ready
          - waiting_input
          - start_transcoding
          - transcoding
          - error
        - type: array
          items:
            type: string
            description: VOD job label
            enum:
            - none
            - ready
            - waiting_input
            - start_transcoding
            - transcoding
            - error
    user_id:
      name: user_id
      in: query
      description: Filter results by one or more user IDs
      style: form
      explode: true
      schema:
        oneOf:
        - type: string
          description: User id
        - type: array
          items:
            type: string
            description: User id
    JobId:
      name: job_id
