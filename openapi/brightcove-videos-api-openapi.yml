      in: path
      name: video_id
      required: true
      schema:
        type: string
      style: simple
    VideoSort:
      description: "Field to sort results by - if absent and there is a search string, results are sorted by relevance or if there is no search string, results are sorted by `-updated_at`. \nNotes: \n  - to sort in descending order, preface the field name with a minus (`-`) sign\n  - this parameter can be used to sort results both for a get videos request and for a get videos in folder request"
      explode: true
      in: query
      name: sort
      schema:
        default: -updated_at
        enum:
        - name
        - -name
        - reference_id
        - -reference_id
        - created_at
        - -created_at
        - published_at
        - -published_at
        - updated_at
        - -updated_at
        - schedule.starts_at
        - -schedule.ends_at
        - state
        - -state
        - plays_total
        - -plays_total
        - plays_trailing_week
        - -plays_trailing_week
        example: created_at
        type: string
        x-enum-elements:
        - description: The video name
          name: name
        - description: The video reference id
          name: reference_id
        - description: Date video was created in the Video Cloud
          name: created_at
        - description: Date video was activated
          name: published_at
        - description: Date video was last updated (by a user or the system)
          name: updated_at
        - description: Date video scheduled to become available
          name: schedule.starts_at
        - description: Date video scheduled to become unavailable
          name: schedule.ends_at
        - description: Whether the video is playable (`ACTIVE` or `INACTIVE`)
          name: state
        - description: All time video views (this field can only be sorted on - it is not returned)
          name: plays_total
        - description: Trailing week video views (this field can only be sorted on - it is not returned)
          name: plays_trailing_week
