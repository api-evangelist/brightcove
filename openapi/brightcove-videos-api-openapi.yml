      type: object
    VideoVariants:
      description: Array of video variants
      type: array
      items:
      - $ref: '#/components/schemas/VideoVariant'
      - $ref: '#/components/schemas/VideoVariant2'
      - $ref: '#/components/schemas/VideoVariant3'
    CuePoint:
      properties:
        force_stop:
          description: Whether playback should be stopped when the cuepoint is reached
          type: boolean
        metadata:
          description: optional metadata string (512 single-byte characters maximum)
          maxLength: 512
          type: string
        name:
          description: cue point name
          type: string
        time:
          description: time of the cue point in seconds
          example: 10.527
          type: number
        type:
          description: cue point type
          enum:
          - AD
          - DATA
          type: string
      required:
      - time
      - type
      title: cue_point
      type: object
    Link:
      description: map of related link properties - can only be added on update, not creation
      properties:
        text:
          description: text for the link
          maxLength: 255
          type: string
        url:
          description: URL for the link
          maxLength: 255
          type: string
      title: link
      type: object
    Geo:
      description: map of geo-filtering properties
      properties:
        countries:
          description: array of ISO 3166 list of 2-letter codes(https://www.iso.org/obp/ui/#home) (search for "country codes")
          example:
          - us
          - ca
          - fr
          items:
            type: string
          type: array
        exclude_countries:
          description: if true, country array is treated as a list of countries excluded from viewing
          type: boolean
        restricted:
          description: whether geo-restriction is enabled for this video
          type: boolean
      required:
      - countries
      - exclude_countries
      - restricted
      title: geo
      type: object
    VideoVariant3:
      description: Object containing language-specific metadata for a video
      properties:
        language:
          type: string
          description: 'The language for this variant in the language-country code format (examples: en-US, es-ES) **Note that `language` is only included when you create a variant - you must NOT include it when updating the variant**'
          example: ja-JA
        name:
          type: string
          description: The title of the video in this language
        description:
          type: string
          description: The video short description in this language
        long_description:
          type: string
          description: The video long description in this language
        custom_fields:
          type: object
          description: 'map of `fieldname: value` pairs, where values are for this language; values have a maximum length of 1024 single-byte characters. Note: be sure to use the **internal** name for the field, not the display name'
    AudioTrack:
      properties:
        duration:
          description: URL the duration of the audio track in milliseconds
          example: 86053
          readOnly: true
          type: integer
        encoding_rates:
          description: array of encoding rates for the audio track renditions in KBPS
          readOnly: true
          example:
          - 64000
          - 96000
          - 127000
          - 192000
          items:
            type: integer
          type: array
        id:
          description: ID for the audio track formed as language_variant
          example: en_alternate
          readOnly: true
          type: string
        is_default:
          description: Whether this is the default audio track
          example: true
          type: boolean
        language:
          description: language code for the audio track
          example: en-US
          type: string
        variant:
          description: the type of audio track (default can be set for the account by contacting Brightcove Support)
          enum:
          - main
          - alternate
          - commentary
          - dub
          - descriptive
          example: main
          type: string
      title: AudioTrack
      type: object
    VideoVariant:
      description: Object containing language-specific metadata for a video
      properties:
        language:
          type: string
          description: 'The language for this variant in the language-country code format (examples: en-US, es-ES) **Note that `language` is only included when you create a variant - you must NOT include it when updating the variant**'
          example: es-ES
        name:
          type: string
          description: The title of the video in this language
        description:
          type: string
          description: The video short description in this language
        long_description:
          type: string
          description: The video long description in this language
        custom_fields:
          type: object
          description: 'map of `fieldname: value` pairs, where values are for this language; values have a maximum length of 1024 single-byte characters. Note: be sure to use the **internal** name for the field, not the display name'
    User:
      description: information about who created or modified a video, if available
      properties:
        email:
          description: the user's email address in Video Cloud
          type: string
        id:
          description: Video Cloud system id of the user
          type: string
        type:
          description: "The type of the updater, either:\n  - `user` a user in Studio\n  - `api-key` a user via the APIs\n  - `internal` a Brightcove system or user"
          enum:
          - user
          - api_key
          - internal
          type: string
      readOnly: true
      title: User
      type: object
    Schedule:
      description: map of scheduling properties
      properties:
        ends_at:
          description: '''End date-time of availability in ISO-8601(https://www.ecma-international.org/ecma-262/5.1/#sec-15.9.1.15) format. Note that you can input a date-time stamp with a time zone, such as `2021-05-01T18:00:00.000+08`, but it will be converted to and stored as a UTC data-time stamp: `2021-05-01T10:00:00.000Z`'''
          example: 2020-05-20 20:41:07.689000+00:00
          nullable: true
          type: string
        starts_at:
          description: '''Start date-time of availability in ISO-8601(https://www.ecma-international.org/ecma-262/5.1/#sec-15.9.1.15) format. Note that you can input a date-time stamp with a time zone, such as `2021-05-01T18:00:00.000+08`, but it will be converted to and stored as a UTC data-time stamp: `2021-05-01T10:00:00.000Z`'''
          example: 2019-05-20 20:41:07.689000+00:00
          nullable: true
          type: string
      title: schedule
      type: object
    VideoVariant2:
      description: Object containing language-specific metadata for a video
      properties:
        language:
          type: string
          description: 'The language for this variant in the language-country code format (examples: en-US, es-ES) **Note that `language` is only included when you create a variant - you must NOT include it when updating the variant**'
          example: de-DE
        name:
          type: string
          description: The title of the video in this language
        description:
          type: string
          description: The video short description in this language
        long_description:
          type: string
          description: The video long description in this language
        custom_fields:
          type: object
          description: 'map of `fieldname: value` pairs, where values are for this language; values have a maximum length of 1024 single-byte characters. Note: be sure to use the **internal** name for the field, not the display name'
    IngestJobStatus:
      properties:
        account_id:
          description: the Video Cloud account id
          example: 57838016001
          readOnly: true
          type: string
        error_code:
          description: the error code if the job failed
          example: UnableToResolveHostError
          readOnly: true
          type: string
        error_message:
          description: the error message if the job failed
          example: There was a problem resolving the host at https://some.site.comm/videos/mp4/IMG_0544.MOV. Please check that it is correct.
          readOnly: true
          type: string
        id:
          description: the ingest job id returned when you submit the Dynamic Ingest API request
          example: 879a3301-5c1a-4b1b-a368-58e200a6e64b
          readOnly: true
          type: string
        priority:
          description: priority of the job (normal or low)
          example: normal
          readOnly: true
          type: string
        started_at:
          description: when processing started
          example: 2018-11-14 19:30:36.265000+00:00
          readOnly: true
          type: string
        state:
          description: "the current state of the ingest job - status:\n  - `processing` - video processing in progress - the video is not currently playable\n  - `publishing` - video processing in progress - publishing a playable rendition\n  - `published` - that at least one playable rendition is available for the video\n  - `finished` - that all processing is complete\n  - `failed` - video processing failed to complete"
          enum:
          - processing
          - publishing
          - published
          - finished
          - failed
          example: failed
          readOnly: true
          type: string
          x-enum-elements:
          - description: video processing in progress - the video is not currently playable
            name: processing
          - description: video processing in progress - publishing a playable rendition
            name: publishing
          - description: there is at least one playable rendition available for the video
            name: published
          - description: video processing is complete
            name: finished
          - description: video processing failed to complete
            name: failed
        submitted_at:
          description: when the job was submitted
          example: 2018-11-14 19:30:36.196000+00:00
          readOnly: true
          type: string
        updated_at:
          description: when the status was last updated
          example: 2018-11-14 19:43:08.641000+00:00
          readOnly: true
          type: string
        video_id:
          description: the video id
          example: 5966995221001
          readOnly: true
          type: string
      title: Ingest Job Status
      type: object
    PlaylistReferences:
      properties:
        playlists:
          description: array of EXPLICIT playlist ids that contain the video
          example: 749117323001
          items:
            type: string
          type: array
      title: PlaylistReferences
      type: object
    Sharing:
      description: map of the sharing properties for the video
      properties:
        by_external_acct:
          description: whether the video was shared from another account
          example: true
          readOnly: true
          type: boolean
        by_id:
