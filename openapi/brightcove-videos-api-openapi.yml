      required: true
      schema:
        type: string
      style: simple
    VideoIds:
      description: 'One or more video ids or one reference id. If reference ids, the syntax is `ref:my_ref_id`. Note that you may include multiple video ids, but only one reference id.


        For example:

        - https://cms.api.brightcove.com/v1/accounts/{{account_id}}/videos/9827342837937

        - https://cms.api.brightcove.com/v1/accounts/{{account_id}}/videos/9827342837937,47584736360

        - https://cms.api.brightcove.com/v1/accounts/{{account_id}}/videos/ref:my_ref_id'
