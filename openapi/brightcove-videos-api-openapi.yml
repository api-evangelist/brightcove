          type: string
        offline_enabled:
          default: false
          description: whether video is enabled for offline viewing
          example: true
          type: boolean
        reference_id:
          description: Reference id for the clip - must be unique within the account
          example: laughing_gull_2019_04_25
          type: string
        schedule:
