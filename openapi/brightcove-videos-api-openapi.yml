        geo:
          $ref: '#/components/schemas/Geo'
        long_description:
          description: A longer description of the video
          example: Herring Gull near Fort Point Channel in Boston, MA, USA. 2019-04-25.
          maxLength: 5000
          type: string
        name:
          description: Title of the video video
          example: A happy herring gull
          maxLength: 250
