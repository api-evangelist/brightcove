      summary: Associate a dynamic overlay for a channel
      operationId: AssociateDynamicOverlay
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: channel_id
        in: path
        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Dynamic overlay details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelDynamicOverlay'
      responses:
        200:
          description: '200'
          content:
            application/json:
