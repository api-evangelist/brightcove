  /accounts/{account_id}/cp_channels/{channel_id}/overlays/{overlay_id}/deactivate:
    x-bc-throttle-key: null
    post:
      tags:
      - Channel Overlays
      summary: Deactivate an overlay asset for a channel
      operationId: DeactivateOverlay
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: channel_id
        in: path
        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
