        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
components:
  schemas:
    GetChannelOverlay:
      title: Get Channel Overlay
      type: object
      properties:
        public_id:
          type: string
        asset_id:
          type: string
        layer:
          type: integer
          format: int32
        opacity:
          type: integer
          format: int32
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        use_original_resolution:
          type: boolean
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        start_time:
          type: string
          format: date-time
        duration:
          type: integer
          format: int32
        created_at:
          type: string
        updated_at:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SCHEDULED
    ChannelOverlayProperties:
      title: Create Channel Overlay
      type: object
      properties:
        asset_id:
          type: string
          description: Overlay image asset's public ID or an URL of a new overlay image
        layer:
          maximum: 1
          minimum: 0
          type: integer
          description: The number of the layer. Higher values of layer are inserted on top of overlays with lower values
          format: int32
        opacity:
          maximum: 100
          minimum: 0
          type: integer
          description: 0 is transparent and 100 is fully opaque
          format: int32
        width:
          type: integer
          description: Specify width for the overlay image in pixels. "use_original_resolution" to use image's original resolution.
          format: int32
        height:
          type: integer
          description: Specify height for the overlay image in pixels. "use_original_resolution" to use image's original resolution.
          format: int32
        use_original_resolution:
          type: boolean
          description: Enable this to use image's original resolution
          default: false
        x:
          type: integer
          description: Placement of the left edge of the overlay relative to the left edge of the video frame, in pixels
          format: int32
        y:
          type: integer
          description: Placement of the top edge of the overlay relative to the top edge of the video frame, in pixels
          format: int32
        start_time:
          type: string
          description: Specify a futuristic start time for this schedule.
          format: date-time
        duration:
          type: integer
          description: Specify how long (hh:mm:ss) the overlay image should appear or leave it empty for unlimited duration
          format: int32
    AsyncMessage:
      title: MessageObject
      type: object
      properties:
        message:
          type: string
          description: message from the api
    CreateChannelOverlay:
      allOf:
      - $ref: '#/components/schemas/ChannelOverlayProperties'
      - required:
        - asset_id
        - layer
        - opacity
        - start_time
        type: object
    UpdateChannelOverlay:
      allOf:
      - $ref: '#/components/schemas/ChannelOverlayProperties'
      - type: object
    GetChannelOverlays:
      title: Get all channel overlays
      type: object
      properties:
        items:
          type: array
          description: The list of overlays.  List may be empty if no overlays are found
          items:
            $ref: '#/components/schemas/GetChannelOverlay'
  securitySchemes:
    BC_OAuth2:
      type: oauth2
      description: Brightcove OAuth API. See the [support documentation](https://support.brightcove.com/oauth-api) or [Getting Access Tokens](https://support.brightcove.com/oauth-api-sample-get-access-token) to learn more
      flows:
        clientCredentials:
          tokenUrl: https://oauth.qa.brightcove.com/v4/access_token
          scopes:
            video-cloud/cloud-playout/all: Able to manage cloud playout channels.
            video-cloud/cloud-playout/read: Able to read cloud playout channels.
            BC_CLOUD_PLAYOUT_READ: Permission-based access control
            BC_CLOUD_PLAYOUT_WRITE: Permission-based access control
x-bc-implicit-head: true
x-bc-implicit-options: true
