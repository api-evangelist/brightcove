openapi: 3.2.0
info:
  title: Brightcove Cloud Playout Channel Manager API Reference Fast…
  description: Reference for the Brightcove Cloud Playout Channel Manager API, used to access and manage your Cloud Playout channels.
  version: 1.0.0
servers:
- url: https://cm.cloudplayout.brightcove.com
  description: Production server
- url: https://cm.cloudplayout.qa.brightcove.com
  description: QA server
tags:
- name: FastChannels
paths:
  /accounts/{account_id}/cp_channels/{channel_id}/frequency-mapping/{frequency_channel_id}:
    x-bc-throttle-key: null
    put:
      tags:
      - FastChannels
      summary: Link Frequency channel ID with parent CP channel
      operationId: LinkFrequencyChannelId
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Content-Type: application/json'
        required: true
        style: simple
        explode: false
        schema:
          type: string
          default: application/json
      - name: channel_id
        in: path
        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: frequency_channel_id
        in: path
        description: Channel Id provided by frequency
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        200:
          description: Create or Update Frequency Channel ID with Parent Cloud Playout Channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelFrequencyMappingResponse'
        400:
          description: Bad Request
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
  /accounts/{account_id}/cp_channels/{channel_id}/frequency-mapping:
    x-bc-throttle-key: null
    delete:
      tags:
      - FastChannels
      summary: Delete Frequency channel ID associated with parent CP channel
      operationId: DeleteFrequencyChannelId
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Content-Type: application/json'
        required: true
        style: simple
        explode: false
        schema:
          type: string
          default: application/json
      - name: channel_id
        in: path
        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        200:
          description: Delete Frequency Channel ID with Parent Cloud Playout Channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Channnel frequency mapping deleted successfully
        400:
          description: Bad Request
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
  /accounts/{account_id}/cp_channels/{channel_id}/schedules/publish:
    x-bc-throttle-key: null
    put:
      tags:
      - FastChannels
      summary: Publish schedule of a fast channel
      description: Publish the schedule of a fast channel
      operationId: PublishFastChannelSchedule
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Content-Type: application/json'
        required: true
        style: simple
        explode: false
        schema:
          type: string
          default: application/json
      - name: channel_id
        in: path
        description: Cloud Playout Channel Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: schedule published
        400:
          description: Bad Request
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
components:
  schemas:
    ChannelFrequencyMappingResponse:
      title: ChannelFrequencyMappingResponse
      type: object
      properties:
        frequency_channel_id:
          type: string
          description: Channel id provided by frequency
        channel_data:
          type: string
          description: Info regarding channel
      example:
        frequency_channel_id: '70701684277865'
        channel_data: ' '
        created_at: 2022-04-20 06:44:16 UTC
        updated_at: 2022-04-20 06:44:16 UTC
    Message:
      title: MessageObject
      type: object
      properties:
        message:
          type: string
          description: message from the api
  securitySchemes:
    BC_OAuth2:
      type: oauth2
      description: Brightcove OAuth API. See the [support documentation](https://support.brightcove.com/oauth-api) or [Getting Access Tokens](https://support.brightcove.com/oauth-api-sample-get-access-token) to learn more
      flows:
        clientCredentials:
          tokenUrl: https://oauth.qa.brightcove.com/v4/access_token
          scopes:
            video-cloud/cloud-playout/all: Able to manage cloud playout channels.
            video-cloud/cloud-playout/read: Able to read cloud playout channels.
            BC_CLOUD_PLAYOUT_READ: Permission-based access control
            BC_CLOUD_PLAYOUT_WRITE: Permission-based access control
x-bc-implicit-head: true
x-bc-implicit-options: true
