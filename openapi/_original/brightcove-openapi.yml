        layer:
          maximum: 1
          minimum: 0
          type: integer
          description: The number of the layer. Higher values of layer are inserted
            on top of overlays with lower values
          format: int32
        opacity:
          maximum: 100
          minimum: 0
          type: integer
          description: 0 is transparent and 100 is fully opaque
          format: int32
        width:
          type: integer
          description: Specify width for the overlay image in pixels. "use_original_resolution"
            to use image's original resolution.
          format: int32
        height:
          type: integer
          description: Specify height for the overlay image in pixels. "use_original_resolution"
            to use image's original resolution.
          format: int32
        use_original_resolution:
          type: boolean
          description: Enable this to use image's original resolution
          default: false
        x:
          type: integer
          description: Placement of the left edge of the overlay relative to the left
            edge of the video frame, in pixels
          format: int32
        y:
          type: integer
          description: Placement of the top edge of the overlay relative to the top
            edge of the video frame, in pixels
          format: int32
        start_time:
          type: string
          description: Specify a futuristic start time for this schedule.
          format: date-time
        duration:
          type: integer
          description: Specify how long (hh:mm:ss) the overlay image should appear
            or leave it empty for unlimited duration
          format: int32
