      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/read
        - BC_CLOUD_PLAYOUT_READ
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
components:
  schemas:
    ChannelMetadataRegionalRatings:
      title: ChannelMetadataRegionalRatings
      type: object
      properties:
        region:
          type: string
        regionName:
          type: string
        ratings:
          type: array
          items:
            type: object
      example:
        region: US
        regionName: United States
        ratings:
        - region: US
          rating: TVG
          age: 1
        - region: US
          rating: TVY
          age: 1
        - region: US
          rating: G
          age: 1
        - region: US
          rating: UR
          age: 1
        - region: US
          rating: NR
          age: 1
        - region: US
          rating: TVY7
          age: 7
        - region: US
          rating: TVY7FV
          age: 7
        - region: US
          rating: TVPG
          age: 8
        - region: US
          rating: PG
          age: 8
        - region: US
          rating: PG13
          age: 13
        - region: US
          rating: TV14
          age: 14
        - region: US
          rating: R
          age: 17
        - region: US
          rating: NC17
          age: 17
        - region: US
          rating: TVMA
          age: 18
    ChannelMetadataRegions:
      title: ChannelMetadataRegions
      type: object
      properties:
        items:
          type: array
          description: The list of regions for channel metadata.
          items:
            type: object
      example:
        items:
        - key: GLOBAL
          regionName: GLOBAL
        - key: AF
          regionName: Afghanistan
    ChannelMetadataSubGenres:
      title: ChannelMetadataSubGenres
      type: object
      properties:
        genre:
          type: string
        subGenre:
          type: array
          items:
            type: object
      example:
        genre: Action & Adventure
        subGenre:
        - Crime
        - International
        - Martial Arts
        - Military
        - Thriller
        - Western
    ChannelMetadataRegion:
      title: ChannelMetadataRegion
      type: object
      properties:
        key:
          type: string
        regionName:
          type: string
      example:
        key: GLOBAL
        regionName: GLOBAL
    ChannelMetadataLanguage:
      title: ChannelMetadataLanguage
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      example:
        code: ab
        name: Abkhazian
    ChannelMetadataLanguages:
      title: ChannelMetadataLanguages
      type: object
      properties:
        items:
          type: array
          description: The list of languages for channel metadata.
          items:
            type: object
      example:
        items:
        - code: ab
          name: Abkhazian
        - code: aa
          name: Afar
    ChannelMetadataGenres:
      title: ChannelMetadataGenres
      type: object
      properties:
        items:
          type: array
          description: The list of genres for channel metadata.
          items:
            type: object
      example:
        items:
        - Action & Adventure
        - Action Sports
        - Animals
        - Animated
  securitySchemes:
    BC_OAuth2:
      type: oauth2
      description: Brightcove OAuth API. See the [support documentation](https://support.brightcove.com/oauth-api) or [Getting Access Tokens](https://support.brightcove.com/oauth-api-sample-get-access-token) to learn more
      flows:
        clientCredentials:
          tokenUrl: https://oauth.qa.brightcove.com/v4/access_token
          scopes:
            video-cloud/cloud-playout/all: Able to manage cloud playout channels.
            video-cloud/cloud-playout/read: Able to read cloud playout channels.
            BC_CLOUD_PLAYOUT_READ: Permission-based access control
            BC_CLOUD_PLAYOUT_WRITE: Permission-based access control
x-bc-implicit-head: true
x-bc-implicit-options: true
