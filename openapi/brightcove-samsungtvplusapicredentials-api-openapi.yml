openapi: 3.2.0
info:
  title: Brightcove Cloud Playout Channel Manager API Reference…
  description: Reference for the Brightcove Cloud Playout Channel Manager API, used to access and manage your Cloud Playout channels.
  version: 1.0.0
servers:
- url: https://cm.cloudplayout.brightcove.com
  description: Production server
- url: https://cm.cloudplayout.qa.brightcove.com
  description: QA server
tags:
- name: SamsungTvPlusApiCredentials
paths:
  /accounts/{account_id}/fast/samsung_tv_plus/credentials:
    x-bc-throttle-key: null
    get:
      tags:
      - SamsungTvPlusApiCredentials
      summary: Get all Samsung TV Plus API Credentials
      operationId: GetSamsungTvPlusApiCredentials
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamsungTvPlusApiCredentialsResponse'
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/read
        - BC_CLOUD_PLAYOUT_READ
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
    post:
      tags:
      - SamsungTvPlusApiCredentials
      summary: Create a Samsung TV Plus API Credential
      operationId: CreateSamsungTvPlusApiCredential
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Content-Type: application/json'
        required: true
        style: simple
        explode: false
        schema:
          type: string
          default: application/json
      requestBody:
        description: Creates Samsung TV Plus API credential for an account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamsungTvPlusApiCredentialBody'
        required: true
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamsungTvPlusApiCredentialResponse'
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
  /accounts/{account_id}/fast/samsung_tv_plus/credentials/{samsung_credential_id}:
    x-bc-throttle-key: null
    get:
      tags:
      - SamsungTvPlusApiCredentials
      summary: Get a Samsung TV Plus API Credential
      operationId: GetSamsungTvPlusApiCredential
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: samsung_credential_id
        in: path
        description: Cloud Playout Samsung TV Plus api credential Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamsungTvPlusApiCredentialResponse'
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/read
        - BC_CLOUD_PLAYOUT_READ
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
    delete:
      tags:
      - SamsungTvPlusApiCredentials
      summary: Delete a Samsung TV Plus API Credential
      operationId: DeleteSamsungTvPlusApiCredential
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: samsung_credential_id
        in: path
        description: Cloud Playout Samsung TV Plus api credential Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Samsung TV Plus API Credential deleted successfully
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
    patch:
      tags:
      - SamsungTvPlusApiCredentials
      summary: Update a Samsung TV Plus API Credential
      operationId: UpdateSamsungTvPlusApiCredential
      parameters:
      - name: account_id
        in: path
        description: Video Cloud account ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: samsung_credential_id
        in: path
        description: Cloud Playout Samsung TV Plus api credential Id
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Content-Type: application/json'
        required: true
        style: simple
        explode: false
        schema:
          type: string
          default: application/json
      requestBody:
        description: Updates Samsung TV Plus API credential for an account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamsungTvPlusApiCredentialBody'
        required: true
      responses:
        200:
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamsungTvPlusApiCredentialResponse'
        401:
          description: 'UNAUTHORIZED: Authentication failed; check to make sure your client credentials were correct for the access token'
          content: {}
        403:
          description: 'BAD_VALUE: Spelling error or other use of non-existent field '
          content: {}
        404:
          description: 'RESOURCE_NOT_FOUND: The api could not find the resource you requested'
          content: {}
      deprecated: false
      security:
      - BC_OAuth2:
        - video-cloud/cloud-playout/all
        - BC_CLOUD_PLAYOUT_WRITE
      x-operation-settings:
        CollectParameters: false
        AllowDynamicQueryParameters: false
        AllowDynamicFormParameters: false
        IsMultiContentStreaming: false
      x-bc-throttle-key: null
components:
  schemas:
    SamsungTvPlusApiCredentialBody:
      title: SamsungTvPlusApiCredentialBody
      type: object
      properties:
        provider_name:
          type: string
          description: Name of the provider
        dev_key:
          type: string
          description: Samsung TV Plus Developer Key
        provider_id:
          type: string
          description: ID of the provider
        env:
          type: string
          description: Environment of the credential
      example:
        env: prod
        provider_id: AUPBB701SA
        provider_name: Brightcove
        dev_key: 01876-IFZ1E-0OZZP-FYZOR-YYYYX
    SamsungTvPlusApiCredentialResponse:
      title: SamsungTvPlusApiCredentialResponse
      type: object
      properties:
        provider_name:
          type: string
          description: Name of the provider
        dev_key:
          type: string
          description: Samsung TV Plus Developer Key
        provider_id:
          type: string
          description: ID of the provider
        env:
          type: string
          description: Environment of the credential
      example:
        public_id: b8090a8b27664cd5a924b61dc997fe11
        account_id: '70701684277865'
        env: prod
        provider_id: AUPBB701SA
        provider_name: Brightcove
        dev_key: 01876-IFZ1E-0OZZP-FYZOR-YYYYX
        created_at: 2022-04-20 06:44:16 UTC
        updated_at: 2022-04-20 06:44:16 UTC
    SamsungTvPlusApiCredentialsResponse:
      title: SamsungTvPlusApiCredentialsResponse
      type: object
      properties:
        items:
          type: array
          description: The list of Samsung TV Plus Credentials. List may be empty if no credentials are found.
          items:
            type: array
      example:
        items:
        - public_id: b8090a8b27664cd5a924b61dc997fe11
          account_id: '70701684277865'
          env: staging
          provider_id: AUPBB701SA
          provider_name: Brightcove
          dev_key: 01876-IFZ1E-0OZZP-FYZOR-YYYYX
          created_at: 2022-04-20 06:44:16 UTC
          updated_at: 2022-04-20 06:44:16 UTC
        - public_id: b8090a8b27664cd5a924b61dc997fe11
          account_id: '70701684277865'
          env: prod
          provider_id: AUPBB701SA
          provider_name: Brightcove
          dev_key: 01876-IFZ1E-0OZZP-FYZOR-YYYYX
          created_at: 2022-04-20 06:44:16 UTC
          updated_at: 2022-04-20 06:44:16 UTC
    Message:
      title: MessageObject
      type: object
      properties:
        message:
          type: string
          description: message from the api
  securitySchemes:
    BC_OAuth2:
      type: oauth2
      description: Brightcove OAuth API. See the [support documentation](https://support.brightcove.com/oauth-api) or [Getting Access Tokens](https://support.brightcove.com/oauth-api-sample-get-access-token) to learn more
      flows:
        clientCredentials:
          tokenUrl: https://oauth.qa.brightcove.com/v4/access_token
          scopes:
            video-cloud/cloud-playout/all: Able to manage cloud playout channels.
            video-cloud/cloud-playout/read: Able to read cloud playout channels.
            BC_CLOUD_PLAYOUT_READ: Permission-based access control
            BC_CLOUD_PLAYOUT_WRITE: Permission-based access control
x-bc-implicit-head: true
x-bc-implicit-options: true
