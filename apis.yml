aid: brightcove
name: Brightcove
description: Brightcove is an online video platform providing REST APIs for uploading
  and managing videos, encoding, CDN delivery, player configuration, analytics, and
  live streaming management. Its Video Cloud platform serves media companies, broadcasters,
  marketers, and OTT providers globally.
