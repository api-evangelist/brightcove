- aid: brightcove:brightcove-clear-sources-api
  name: Brightcove Clear-Sources API
  description: "Clear_sources endpoints expose unencrypted sources to the preview players in the studio\
    \ for customers who are using [Playback Rights](/playback-restrictions/references/index.html) to protect\
    \ DRM and HLSe video content. This endpoint is also useful for customers who want to make their protected\
    \ source files available to 3rd parties or internal users who have access to their API credentials.\n\
    \n  **Important Notes:**\n  \n  1. Once the unprotected URL is made available, Brightcove and the\
    \ client have no control over who has access to the content or how it is used.\n  2. There will be\
    \ egress bandwidth charges made to your account when the sources are accessed."
  humanURL: https://apis.support.brightcove.com/cms/
  baseURL: https://cms.api.brightcove.com/v1
